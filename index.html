<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Comida Casera Marketplace</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <header class="text-center p-3 bg-primary text-white">
            <h1>Marketplace de Comida Casera</h1>
        </header>

            <section id="menu-section" class="mt-5">
            <h2>Menú del Restaurante</h2>
            <div id="menu-list" class="row">
                <!---Los productos de agregaran con JavaScript-->
            </div>
            </section>

            <section class="mt-5">
                <h2>Realizar Pedido</h2>
                <form id="order-form">
                    <div id="order--items"></div>
                    <div class="mb-3">
                        <label for="customerName" class="form-label">Nombre del Cliente</label>
                        <input type="text" id="customerName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="deliveryMethod" class="form-label">Método de entrega</label>
                        <select id="deliveryMethod" class="form-select" required>
                            <option value="">Seleccionar</option>
                            <option value="pickup">Recoger en local</option>
                            <option value="delivery">Entrega a domicilio</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="notes" class="form-label">Notas adicionales</label>
                        <textarea id="notes" class="form-control" rows="3" placeholder="Por ejemplo: sin tomate y extra picante..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Confirmar Pedido</button>
                </form>
            </section>

            <section class="mt-5">
                <h2>Pedidos Realizados</h2>
                <div id="orders-list" class="list-group"></div>
            </section>
        </main>
    </body>
</html>
