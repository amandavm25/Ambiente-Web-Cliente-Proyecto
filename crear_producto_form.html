<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Crear Producto</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <header class="text-center p-3 bg-primary text-white">
            <h1>Agregar Nuevo Producto</h1>
        </header>

        <main class="container mt-4">
            <form action="crear_producto.php" method="POST">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del Producto</label>
                    <input type="text" name="nombre" id="nombre" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Precio (en colones)</label>
                    <input type="number" name="precio" id="precio" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="imagen" class="form-label">URL de la Imagen</label>
                    <input type="text" name="imagen" id="imagen" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success">Crear Producto</button>
                <a href="dashboard_negocio.php" class="btn btn-secondary ms-2">Cancelar</a>
            </form>
        </main>
    </body>
</html>
