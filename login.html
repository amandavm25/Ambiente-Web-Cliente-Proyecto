<!DOCTYPE html>
<html lang="es">
    <head>
       <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Comida Casera Marketplace</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> 
    </head>
    <body>
       <header class="text-center p-3 bg-primary text-white">
            <h1>Marketplace de Comida Casera</h1>
        </header> 

    <main class="container mt-4">
            <section id="auth" class="mb-5">
                <h2>Iniciar Sesión</h2>
                <form id="login-form">
                    <input type="email" class="form-control mb-3" placeholder="Correo" required>
                    <input type="password" class="form-control mb-3" placeholder="Contraseña" required>
                    <button type="submit" class="btn btn-success">Iniciar Sesión</button>
                </form>
            </section>
    </main>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'menu.html';
        });
    </script>
     </body>
</html>
