<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Realizar Pedido - Comida Casera Marketplace</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <header class="text-center p-3 bg-primary text-white">
            <h1>Realizar Pedido</h1>
            <a href="menu.html" class="btn btn-light mt-2">Volver al Menú</a>
        </header>

        <main class="container mt-4">
            <section>
                <h2 class="mb-3">Seleccionar tus platos</h2>
                <div id="cart-items" class="mb-4">
                    <!-- Los elemntos seleccionados del menú se mostraran aqui -->
                </div>

                <form id="order-form">
                    <div class="mb-3">
                        <label for="customerName" class="form-label">Nombre del Cliente</label>
                        <input type="text" id="customerName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="deliveryMethod" class="form-label">Método de entrega</label>
                        <select id="deliveryMethod" class="form-select" required>
                            <option value="">Seleccionar</option>
                            <option value="pickup">Recoger en local</option>
                            <option value="delivery">Entrega a domicilio</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="notes" class="form-label">Notas adicionales</label>
                        <textarea id="notes" class="form-control" rows="3" placeholder="Por ejemplo: sin cebolla, extra picante..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Confirmar Pedido</button>
                </form>
            </section>
        </main>

        <footer class="text-center p-3 bg-dark text-light mt-4">
            <p>&copy; 2025 🥘 Mamalila - Sabores Caseros con Amor. Todos los derechos reservados.</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
