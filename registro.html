<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro- Comida Casera</title>
    <link rel="stylesheet" href="styles.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <header class="text-center p-3 bg-primary text-white">
        <h1>Registro - Comida Casera</h1>
    </header>

    <main class="container mt-4">
        <section id="registro" class="mb-5">
            <h2>Registrarse</h2>
            <form id="registration-form">
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre Completo</label>
                    <input type="text" id="name" class="form-control" placeholder="Amanda Valverde" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="amandavm25@gmail.com" required>
                </div>
                <div class="mb-3">
                   <label for="password" class="form-label">Contraseña</label> 
                   <input type="password" id="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success">Registrarse</button>
            </form>
        </section>
        </main>
        <script>
            document.getElementById('registration-form').addEventListener('submit', function(e) {
                e.preventDefault();
                window.location.href = 'menu.html'; 
            });
        </script>
    </body>
</html>
